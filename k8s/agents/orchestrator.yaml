## Orchestrator Deployment — coordinates agent workers via Taiga webhooks.
## Uses the 'orchestrator' ServiceAccount which has RBAC for managing Jobs,
## ConfigMaps, and Secrets in the agents namespace.

apiVersion: v1
kind: ConfigMap
metadata:
  name: orchestrator-config
  namespace: agents
data:
  config.yaml: |
    gitea:
      url: "http://gitea-http.gitea.svc.cluster.local:3001"
      adminUsername: "claude"
      adminPassword: "password"
    taiga:
      url: "http://taiga-gateway.taiga.svc.cluster.local:9000"
      adminUsername: "admin"
      adminPassword: "password"
      projectSlug: "dev-environment"
      webhookSecret: ""
      humanUsername: "wistefan"
    agents:
      maxConcurrency: 3
      idleTimeoutSeconds: 300
      taskTimeoutSeconds: 3600
      retryLimit: 2
      containerImage: "localhost:5000/agent-worker:latest"
      # Claude model and effort for the implementing agents (analysis,
      # plan, step, onestep, fix). Both go straight to the Claude CLI as
      # --model / --effort, so a model id the CLI does not know makes
      # every agent die in under a second and be respawned forever —
      # change it with care. Effort is low|medium|high|xhigh|max.
      model: "claude-opus-5-5"
      effort: "high"
      review:
        # Automated senior-engineer PR reviews. A dedicated review-agent-N
        # posts a COMMENT review on each open ticket PR whose head commit
        # has not been reviewed yet. It never approves, requests changes,
        # or merges — that stays with the human. Set false to disable.
        enabled: true
        # Separate keys from the implementing agents above even when the
        # values match, so reviewers can be moved on their own.
        model: "claude-opus-5-5"
        effort: "high"
      specializations:
        # Reviewers read code and report; they never modify a repository.
        review:
          allowedTools: ["Read", "Glob", "Grep", "Bash", "Task"]
    notifications:
      webhookUrl: ""
      dashboardPort: 8080
      desktopNotify: false
    kubernetes:
      namespace: "agents"
      agentServiceAccount: "agent-worker"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: agents
  labels:
    app: orchestrator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      serviceAccountName: orchestrator
      containers:
        - name: orchestrator
          image: localhost:5000/orchestrator:latest
          # Always pull so `./scripts/import-images.sh orchestrator` followed
          # by `kubectl rollout restart` actually picks up the new image.
          # With IfNotPresent the kubelet kept serving the previously-cached
          # `:latest` digest indefinitely.
          imagePullPolicy: Always
          args:
            - "--config=/etc/orchestrator/config.yaml"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/orchestrator
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: orchestrator-config

---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: agents
spec:
  selector:
    app: orchestrator
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
